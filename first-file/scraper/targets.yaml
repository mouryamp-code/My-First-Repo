# ---------------------------------------------------------------------------------------------
# Amazon only (Creators API sync, see .github/workflows/amazon-*.yml). Bigger quotas than the
# store scrapers, plus brand + category search terms chosen from the brands that fill our catalog,
# so Amazon results match products we already list. Each search term returns 10 results per page;
# the peripherals run reads 3 pages, the PC parts run 2. Budget: ~3,000 API requests/day.
amazon_quotas:
  cpu: 200
  gpu: 400
  motherboard: 400
  ram: 300
  psu: 200
  case: 250
  ssd: 300
  hdd: 120
  cooler: 200
  monitor: 300
  fan: 120
  keyboard: 300
  mouse: 300
  headset: 250
  controller: 150

