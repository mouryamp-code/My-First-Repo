# Per-store, per-category listing quotas and popular-model seeds.
# Listings matching a seed are picked first (to maximise cross-store overlap); the rest of the
# quota is filled in the store's own order. JSON-feed stores (Shopify / WooCommerce Store API)
# return 100-250 products per request, so these quotas cost only a few requests per category.

quotas:
  cpu: 60
  gpu: 150
  motherboard: 120
  ram: 80
  psu: 60
  case: 80

expanded_quotas:
