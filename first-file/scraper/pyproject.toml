[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pcforge-scraper"
version = "0.1.0"
description = "price comparison scraper, normalizer, matcher, and Cuelinks affiliate adapter"
requires-python = ">=3.12"
dependencies = [
    "curl-cffi>=0.7.0",
    "httpx>=0.28.0",
    "playwright>=1.49.0",
    "psycopg[binary]>=3.2.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "pyyaml>=6.0.2",
    "rapidfuzz>=3.11.0",
    "rich>=13.9.0",
    "selectolax>=0.3.26",
    "typer>=0.15.0",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.14.0",
    "pytest>=8.3.0",
    "ruff>=0.9.0",
    "types-PyYAML>=6.0.12",
]

[project.scripts]
pcforge-scrape = "pcforge_scraper.cli:app"
pcforge-normalize = "pcforge_scraper.cli:normalize_app"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "UP006", "UP035", "UP045"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

