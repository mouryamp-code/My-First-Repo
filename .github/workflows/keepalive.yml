name: keepalive

# GitHub pauses schedules in a public repository after 60 days without activity.
# Checked daily; first-file/scripts/keepalive.py decides whether today is a day to push.
on:
  schedule:
    - cron: "41 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  keepalive:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - run: python3 first-file/scripts/keepalive.py
      - name: Push the date if it changed
        run: |
          [ -n "$(git status --porcelain first-file/last_run.json)" ] || { echo "Not due yet"; exit 0; }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add first-file/last_run.json
          git commit -m "Update date"
          git push
